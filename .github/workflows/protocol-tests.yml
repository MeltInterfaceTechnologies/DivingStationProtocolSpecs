name: Protocol tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protocol-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  tests:
    name: Protocol tests (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Snapshot lock phase and immutable inputs
        env:
          SNAPSHOT_BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python -B tools/check_ci_snapshot.py --base-commit "$SNAPSHOT_BASE_COMMIT"
      - name: Deterministic runtime and fixture tests
        run: python -B -m unittest discover -s tests -v
      - name: Independent oracle sensitivity
        run: python -B tools/check_oracle_sensitivity.py
      - name: Loopback UDP adapter
        run: python -B -m unittest discover -s integration_tests -v
      - name: Distribution audit
        run: python -B tools/audit_public.py
